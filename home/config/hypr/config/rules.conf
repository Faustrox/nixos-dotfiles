windowrule = float, class:steam
windowrule = tile, class:steam, title:Friends List
windowrule = tile, class:steam, title:Steam 

# No shadow for tiled windows (matches windows that are not floating).
windowrulev2 = noshadow, floating:0

# -- Gaming --

# Game Detection
windowrule = tag +games, class:^(gamescope)$|^(.gamescope-wrapped)$|^(cs2)$|^(Minecraft.*)$|^(steam_app_.*)$|^(.*\.exe)$
windowrule = tag +games, onworkspace:2

# Game Window Behavior
windowrule = tile, tag:games                    # Force tiling mode for games
windowrule = noshadow, tag:games                # Remove shadows for better performance
windowrule = noblur, tag:games                  # Disable blur effects
windowrule = immediate, tag:games               # Immediate mode for better responsiveness
# windowrule = fullscreen, tag:games*           # Force fullscreen for all games
# windowrule = noborder, tag:games*             # Remove window borders

# Game Window Placement
# windowrule = monitor DP-1, tag:games          # Force games to primary monitor
# windowrule = workspace 2, tag:games           # Force games to workspace 2
windowrule = content game, tag:games            # Set content type to game

# -- Other apps --

windowrule = content video, class:stremio

windowrule = float, class:clipse
windowrule = size 622 652, class:clipse

windowrule = opacity 0.8 0.8, class:kitty
windowrule = opacity 0.8 0.8, class:Spotify
windowrule = float, class:qalculate-gtk

windowrule = float, class:com.github.hluk.copyq

# -- Misc --

windowrule = noinitialfocus,class:^(net-runelite-client-RuneLite)$,title:^win(.*)$