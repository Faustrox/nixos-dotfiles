###################
### MY PROGRAMS ###
###################

# Set programs that you use
$calculator = qalculate-gtk
$terminal = kitty
$fileManager = nautilus
$browser = firefox
$monitor = gnome-system-monitor

####################
##    Scripts     ##
####################

$panel = $HOME/.scripts/start.sh
$launcher = $HOME/.config/hypr/scripts/app-launcher.sh
$screenshotMonitor = $HOME/.config/hypr/scripts/screenshot-monitor.sh
$gaminglock = $HOME/.config/hypr/scripts/gaminglock.sh
$replayMode = $HOME/.config/hypr/scripts/replay-mode.sh
$saveReplay = $HOME/.config/hypr/scripts/save-replay.sh

####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER # Sets "Windows" key as main modifier

# Scripts
bind = $mainMod Shift, W, exec, uwsm app -s b -t service -- $panel
bind = $mainMod, PRINT, exec, uwsm app -s b -- $screenshotMonitor # Screenshot focused monitor
bind = $mainMod Shift, G, exec, $gaminglock
bind = $mainMod, F1, exec, uwsm app -- $replayMode 
bind = $mainMod, F2, exec, uwsm app -- $replayMode DP-2
bind = $mainMod, F3, exec, $saveReplay
bind = $mainMod, R, exec, ags toggle launcher

# Apps runs
bind = $mainMod, C, exec, uwsm app -s b -- $calculator
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, B, exec, uwsm app -s b -- $browser
bind = $mainMod, Space, exec, uwsm app -- $terminal
bind = Ctrl Alt, M, exec, uwsm app -s b -t service -- $monitor
bind = $mainMod, M, exec, uwsm app -s b -t service -- noisetorch -i

# Actions
bind = $mainMod, Z, layoutmsg, swapwithmaster
#bind = $mainMod Shift, Z, makegroup, h, ephemeral
bind = $mainMod, Q, killactive
bind = $mainMod Shift, Q, exec, hyprctl activewindow | grep pid | tr -d "pid:"| xargs kill -9
bind = $mainMod, F, togglefloating,
bind = $mainMod Shift, F, fullscreen,

# System Shortcuts
# bind = $mainMod Shift, M, exec, wlogout --css .config/wlogout/style.css # Logout
bind = $mainMod Shift, R, exec, hyprctl reload
bind = $mainMod Shift, C, centerwindow, 
bind = Alt Shift, C, exec, uwsm app -s b -- hyprpicker -a
bind = $mainMod Shift, S, exec, uwsm app -s b -- grim -g "$(slurp -d)" - | wl-copy -t image/png # Screenshot
bind = $mainMod, V, exec, uwsm app -s b -- $terminal --class clipse -e clipse # Clipboard

# Volume Shortcuts
bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioStop, exec, playerctl stop
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous

# Move/Change window focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = Alt, Tab, layoutmsg, cyclenext 

# Move Window
bind = $mainMod Ctrl, Left, movewindow, l
bind = $mainMod Ctrl, Right, movewindow, r
bind = $mainMod Ctrl, Up, movewindow, u
bind = $mainMod Ctrl, Down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod Ctrl, 1, workspace, 5
bind = $mainMod Ctrl, 2, workspace, 6
bind = $mainMod Ctrl, 3, workspace, 7
bind = $mainMod Ctrl, 4, workspace, 8

# Switch workspaces to a relative workspace
bind = $mainMod Alt, Right, workspace, r+1
bind = $mainMod Alt, Left, workspace, r-1

# Move focused window to a relative workspace
bind = $mainMod Ctrl Alt, Right, movetoworkspace, r+1
bind = $mainMod Ctrl Alt, Left, movetoworkspace, r-1

# Special workspace
bind = $mainMod, X, togglespecialworkspace, magic
bind = $mainMod Shift, X, movetoworkspace, special:magic

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
